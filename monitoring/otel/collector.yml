# Único ponto de entrada de telemetria: os serviços falam OTLP só com este
# collector, e ele decide pra onde mandar. Trocar/adicionar backend (Tempo,
# Zabbix, Jaeger...) é mexer aqui, sem tocar no código das aplicações.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
