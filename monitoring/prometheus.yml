global:
  scrape_interval: 15s

scrape_configs:
  - job_name: webhook-receiver
    static_configs:
      - targets: ["webhook-receiver:8000"]

  - job_name: ingestion-consumer
    static_configs:
      - targets: ["ingestion-consumer:9100"]

  - job_name: order-approved-worker
    static_configs:
      - targets: ["order-approved-worker:9101"]

  - job_name: mock-external-api
    static_configs:
      - targets: ["mock-external-api:9000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mssql-exporter
    static_configs:
      - targets: ["mssql-exporter:4000"]

  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]
