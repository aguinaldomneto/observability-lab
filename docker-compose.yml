x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  AIRFLOW__CORE__FERNET_KEY: ""
  MSSQL_ODBC_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver;DATABASE=${MSSQL_DATABASE:-ecommerce};UID=sa;PWD=${MSSQL_SA_PASSWORD};TrustServerCertificate=yes;"
  # used directly (not via the DSN above) by generate_and_load, which shells
  # out to bcp instead of going through pyodbc for the bulk load itself
  MSSQL_HOST: sqlserver
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
  MSSQL_DATABASE: ${MSSQL_DATABASE:-ecommerce}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 2g

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  topics-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        # `|| true`: topics already exist on a restart (named volume), and
        # `rpk topic create` exits non-zero for TOPIC_ALREADY_EXISTS.
        rpk topic create webhook-events     --partitions 6 --replicas 1 --brokers redpanda:9092 || true
        rpk topic create order-approved     --partitions 3 --replicas 1 --brokers redpanda:9092 || true
        rpk topic create order-approved-dlq --partitions 1 --replicas 1 --brokers redpanda:9092 || true

  migrate:
    build:
      context: ./db
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-ecommerce}
    depends_on:
      sqlserver:
        condition: service_healthy

  webhook-receiver:
    build:
      context: ./services/webhook_receiver
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "8000:8000"
    depends_on:
      topics-init:
        condition: service_completed_successfully

  ingestion-consumer:
    build:
      context: .
      dockerfile: services/ingestion_consumer/Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      DATABASE_URL: mssql+pyodbc://sa:${MSSQL_SA_PASSWORD}@sqlserver/${MSSQL_DATABASE:-ecommerce}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    expose:
      - "9100"  # /metrics, scraped by Prometheus over the internal network
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics-init:
        condition: service_completed_successfully
    # Scale out with: docker compose up -d --scale ingestion-consumer=3
    # (Prometheus only ever reaches one replica's /metrics this way — see
    # README, "Monitoramento" — a known limitation of static scrape configs.)

  order-approved-worker:
    build:
      context: ./services/order_approved_worker
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      EXTERNAL_API_URL: http://mock-external-api:9000/erp/orders
    expose:
      - "9101"
    depends_on:
      topics-init:
        condition: service_completed_successfully

  mock-external-api:
    build:
      context: ./services/mock_external_api
    restart: unless-stopped
    environment:
      FAILURE_RATE: ${FAILURE_RATE:-0.3}
    ports:
      - "9000:9000"

  airflow-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: ./airflow
    environment:
      <<: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname admin --lastname admin --role Admin --email admin@example.com \
          || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    build:
      context: ./airflow
    command: webserver
    restart: unless-stopped
    environment:
      <<: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: ./airflow
    command: scheduler
    restart: unless-stopped
    environment:
      <<: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      sqlserver:
        condition: service_healthy

  load-simulator:
    build:
      context: ./services/load_simulator
    profiles: ["tools"]  # only runs on demand: docker compose --profile tools run --rm load-simulator
    depends_on:
      - webhook-receiver
    entrypoint: ["python", "simulate.py", "--url", "http://webhook-receiver:8000/webhooks/events"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command: ["--docker_only=true"]
    # Docker isolates each container into its own cgroup namespace by
    # default on cgroup v2 hosts — without this, cAdvisor only ever sees
    # its own cgroup root (id="/") and never discovers sibling containers.
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    expose:
      - "8080"

  mssql-exporter:
    image: awaragi/prometheus-mssql-exporter:latest
    restart: unless-stopped
    environment:
      SERVER: sqlserver
      USERNAME: sa
      PASSWORD: ${MSSQL_SA_PASSWORD}
    expose:
      - "4000"
    depends_on:
      sqlserver:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - mssql-exporter

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  sqlserver_data:
  redpanda_data:
  airflow_pg_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
